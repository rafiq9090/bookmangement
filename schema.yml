components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        recipient_name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          maxLength: 20
        street_address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state_division:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 50
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - created_at
      - id
      - phone_number
      - postal_code
      - recipient_name
      - state_division
      - street_address
    Author:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        biography:
          type: string
        photo:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
      - slug
    Book:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 280
          pattern: ^[-a-zA-Z0-9_]+$
        isbn_10:
          type: string
          maxLength: 10
        isbn_13:
          type: string
          maxLength: 13
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
          readOnly: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          readOnly: true
        publisher:
          type: string
          maxLength: 150
        publication_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        language:
          type: string
          maxLength: 50
        cover_image:
          type: string
          format: uri
          nullable: true
        description:
          type: string
        available_listings_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - authors
      - available_listings_count
      - categories
      - id
      - isbn_13
      - slug
      - title
    BookListingRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        book:
          allOf:
          - $ref: '#/components/schemas/Book'
          readOnly: true
        seller_name:
          type: string
          readOnly: true
        seller_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        condition_notes:
          type: string
          description: 'Specific wear details: markings, tears, yellowed pages, bindings.'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Listing price in platform currency.
        original_mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          description: Original printed cover price (for comparison).
        edition_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Year this specific physical copy was printed.
        is_hardcover:
          type: boolean
        has_dust_jacket:
          type: boolean
        is_signed_by_author:
          type: boolean
        status:
          $ref: '#/components/schemas/BookListingReadStatusEnum'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ListingImage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - book
      - created_at
      - id
      - images
      - price
      - seller_name
      - seller_rating
    BookListingReadStatusEnum:
      enum:
      - DRAFT
      - ACTIVE
      - RESERVED
      - SOLD
      - ARCHIVED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `ACTIVE` - Active / Available
        * `RESERVED` - Reserved (Checkout in progress)
        * `SOLD` - Sold
        * `ARCHIVED` - Archived / Deactivated
    BookListingWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        book:
          type: integer
          description: The canonical book record.
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        condition_notes:
          type: string
          description: 'Specific wear details: markings, tears, yellowed pages, bindings.'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Listing price in platform currency.
        original_mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          description: Original printed cover price (for comparison).
        edition_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Year this specific physical copy was printed.
        is_hardcover:
          type: boolean
        has_dust_jacket:
          type: boolean
        is_signed_by_author:
          type: boolean
      required:
      - book
      - id
      - price
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_price:
          type: string
          readOnly: true
      required:
      - id
      - items
      - total_price
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        listing:
          allOf:
          - $ref: '#/components/schemas/BookListingRead'
          readOnly: true
        listing_id:
          type: integer
          writeOnly: true
        added_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - added_at
      - id
      - listing
      - listing_id
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
      required:
      - id
      - name
      - slug
    CheckoutRequest:
      type: object
      properties:
        recipient_name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          maxLength: 20
        street_address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state_division:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          default: Bangladesh
          maxLength: 50
      required:
      - city
      - phone_number
      - postal_code
      - recipient_name
      - state_division
      - street_address
    ConditionEnum:
      enum:
      - LIKE_NEW
      - VERY_GOOD
      - GOOD
      - ACCEPTABLE
      - COLLECTIBLE
      type: string
      description: |-
        * `LIKE_NEW` - Like New (Minimal signs of wear)
        * `VERY_GOOD` - Very Good (Clean pages, light spine creasing)
        * `GOOD` - Good (Average used wear, possible notes/highlights)
        * `ACCEPTABLE` - Acceptable (Readable copy, noticeable wear or damage)
        * `COLLECTIBLE` - Collectible / Vintage (Rare edition, signed)
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        listing:
          type: integer
        book_title:
          type: string
          readOnly: true
        listing_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        buyer_email:
          type: string
          format: email
          readOnly: true
        seller_store:
          type: string
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/InquiryMessage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - book_title
      - buyer_email
      - created_at
      - id
      - listing
      - listing_price
      - messages
      - seller_store
      - updated_at
    CourierWebhookRequest:
      type: object
      properties:
        tracking_number:
          type: string
        status:
          type: string
        hub_name:
          type: string
      required:
      - status
      - tracking_number
    CourierWebhookResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    DispatchShipmentRequest:
      type: object
      properties:
        courier_name:
          type: string
          default: Steadfast
        tracking_number:
          type: string
      required:
      - tracking_number
    DispatchShipmentResponse:
      type: object
      properties:
        status:
          type: string
        tracking_number:
          type: string
      required:
      - status
      - tracking_number
    EntryTypeEnum:
      enum:
      - SALE_CREDIT
      - PLATFORM_FEE
      - PAYOUT_DEBIT
      - REFUND_DEBIT
      type: string
      description: |-
        * `SALE_CREDIT` - Sale Revenue
        * `PLATFORM_FEE` - Platform Commission
        * `PAYOUT_DEBIT` - Bank/MFS Withdrawal
        * `REFUND_DEBIT` - Order Refund
    GatewayEnum:
      enum:
      - SSLCOMMERZ
      - STRIPE
      - BKASH
      type: string
      description: |-
        * `SSLCOMMERZ` - SSLCommerz
        * `STRIPE` - Stripe
        * `BKASH` - bKash Direct
    InquiryMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender_email:
          type: string
          format: email
          readOnly: true
        text:
          type: string
        photo_evidence:
          type: string
          format: uri
          nullable: true
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_read
      - sender_email
      - text
    KycStatusEnum:
      enum:
      - UNVERIFIED
      - PENDING
      - VERIFIED
      - REJECTED
      type: string
      description: |-
        * `UNVERIFIED` - Unverified
        * `PENDING` - Pending Review
        * `VERIFIED` - Verified
        * `REJECTED` - Rejected
    ListingImage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        webp_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        caption:
          type: string
          maxLength: 100
        is_primary:
          type: boolean
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - image
      - uploaded_at
      - webp_image
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        shipping_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        shipping_address_snapshot:
          description: Immutable snapshot of shipping details at the moment of purchase.
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/OrderShipment'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - shipments
      - total_amount
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        book_title:
          type: string
          readOnly: true
        condition:
          type: string
          readOnly: true
        price_at_purchase:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
      required:
      - book_title
      - condition
      - id
      - price_at_purchase
    OrderShipment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        seller_store:
          type: string
          readOnly: true
        courier_name:
          type: string
          maxLength: 50
        tracking_number:
          type: string
          maxLength: 100
        shipping_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/OrderShipmentStatusEnum'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        dispatched_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - items
      - seller_store
      - subtotal
    OrderShipmentStatusEnum:
      enum:
      - WAITING
      - PICKED_UP
      - IN_TRANSIT
      - DELIVERED
      - RETURNED
      type: string
      description: |-
        * `WAITING` - Waiting for Seller Dispatch
        * `PICKED_UP` - Picked Up by Courier
        * `IN_TRANSIT` - In Transit
        * `DELIVERED` - Delivered
        * `RETURNED` - Returned / Disputed
    OrderStatusEnum:
      enum:
      - PENDING
