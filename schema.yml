      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending Payment
        * `PAID` - Paid & Escrow Held
        * `PROCESSING` - In Progress
        * `COMPLETED` - All Shipments Delivered
        * `CANCELLED` - Cancelled
