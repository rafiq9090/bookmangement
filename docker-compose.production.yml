x-app: &app
  build: .
  env_file: .env.production
  restart: unless-stopped
  volumes:
    - public_media:/app/media
    - private_evidence:/app/private_uploads
    - static_assets:/app/staticfiles
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    healthcheck:
      # Use a permitted real Host; TLS is terminated at Caddy.
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':os.environ['APP_HOST'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *app
    command: celery -A config worker --loglevel=info
  scheduler:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - public_media:/srv/media:ro
      - static_assets:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  public_media:
  private_evidence:
  static_assets:
  caddy_data:
  caddy_config:
