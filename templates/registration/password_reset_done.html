{% extends "registration/password_reset_base.html" %}
{% block reset_content %}
<h1 class="font-heading text-2xl font-bold">Check your email</h1>
<p class="text-sm text-gray-500">If an active account matches that email, we’ve sent a password reset link. Check your spam folder too.</p>
<a href="{% url 'login' %}" class="inline-flex justify-center w-full bg-brand-orange text-white rounded-xl py-3 text-sm font-bold">Back to sign in</a>
{% endblock %}
