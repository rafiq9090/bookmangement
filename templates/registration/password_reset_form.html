{% extends "registration/password_reset_base.html" %}
{% block reset_content %}
<h1 class="font-heading text-2xl font-bold">Forgot your password?</h1>
<p class="text-sm text-gray-500">Enter your account email and we’ll send you a password reset link.</p>
<form method="post" class="password-reset-fields space-y-4">{% csrf_token %}
{{ form.non_field_errors }}
<div><label for="{{ form.email.id_for_label }}" class="block text-sm font-semibold mb-2">Email address</label>{{ form.email }}{{ form.email.errors }}</div>
<button class="w-full bg-brand-orange text-white rounded-xl py-3 text-sm font-bold">Send reset link</button>
</form>
<a href="{% url 'login' %}" class="inline-block text-sm text-brand-orange font-semibold">Back to sign in</a>
{% endblock %}
