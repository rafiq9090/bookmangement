<!-- BEGIN: PromoBannerSection -->
<section class="w-full max-w-[1360px] mx-auto px-4 sm:px-6 lg:px-8 py-10 box-border"
    data-purpose="promo-banner-section">
    <div
        class="bg-[#FFF4EB] rounded-3xl p-6 sm:p-12 border border-orange-100/60 relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6 sm:gap-8">
        <!-- Left Book Pair Art -->
        <div class="flex items-center -space-x-6 relative">
            <div
                class="w-28 h-40 bg-gradient-to-br from-indigo-500 to-blue-700 rounded-md shadow-xl transform -rotate-12 border border-white/20 p-2 text-white flex flex-col justify-between">
                <span class="text-[10px] uppercase tracking-wider font-semibold opacity-80">Glittering
                    Stars</span>
                <i class="fa-regular fa-star text-center text-xl text-yellow-300"></i>
                <span class="text-[8px] opacity-70">Vol. 1</span>
            </div>
            <div
                class="w-28 h-40 bg-gradient-to-br from-slate-700 to-slate-950 rounded-md shadow-2xl transform rotate-6 border border-white/20 p-2 text-white flex flex-col justify-between">
                <span class="text-[10px] uppercase tracking-wider font-semibold opacity-80">Night Castle</span>
                <i class="fa-solid fa-chess-rook text-center text-xl text-slate-300"></i>
                <span class="text-[8px] opacity-70">Story Book</span>
            </div>
        </div>
        <!-- Center Text & CTA -->
        <div class="text-center md:text-left space-y-4 max-w-md">
            <h3
                class="font-heading font-extrabold text-2xl sm:text-3xl lg:text-4xl text-gray-900 leading-tight">
                Find the books <span class="text-[#FF5A1F]">you love</span><br>at pocket-friendly prices.
            </h3>
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 pt-2">
                <a href="{% url 'store' %}"
                    class="bg-[#FF5A1F] hover:bg-orange-600 text-white font-medium text-xs sm:text-sm px-6 py-2.5 rounded-full shadow-md shadow-orange-500/20 transition-all inline-flex items-center gap-2">
                    <span>Purchase Now</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
                <a href="{% url 'cart' %}"
                    class="bg-white border border-gray-300 hover:border-gray-400 text-gray-700 font-medium text-xs sm:text-sm px-6 py-2.5 rounded-full transition-all inline-flex items-center gap-2">
                    <i class="fa-solid fa-ticket text-xs text-[#FF5A1F]"></i>
                    <span>Apply Coupon</span>
                </a>
            </div>
        </div>
        <!-- Right Stack & 3D Mouse Graphic (Desktop) -->
        <div class="hidden lg:flex items-center space-x-4">
            <div class="flex flex-col space-y-1 items-center">
                <div class="w-28 h-6 bg-red-400 rounded-sm shadow-sm"></div>
                <div class="w-32 h-6 bg-orange-500 rounded-sm shadow-sm"></div>
                <div class="w-36 h-7 bg-amber-400 rounded-sm shadow-sm"></div>
                <div class="w-40 h-8 bg-rose-500 rounded-sm shadow-md"></div>
            </div>
            <!-- 3D Style Mouse -->
            <div
                class="relative w-12 h-20 bg-gradient-to-b from-rose-500 to-orange-500 rounded-full border-2 border-white/60 shadow-lg flex flex-col items-center pt-2">
                <div class="w-1.5 h-3 bg-white/70 rounded-full mb-1"></div>
            </div>
        </div>
    </div>
</section>
<!-- END: PromoBannerSection -->
