<!-- ================= DELETE ADDRESS CONFIRMATION MODAL ================= -->
<div id="deleteAddressModal" class="fixed inset-0 z-50 hidden opacity-0 transition-opacity duration-200 flex items-center justify-center p-4">
    <!-- Backdrop Blur -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-xs transition-opacity" onclick="closeDeleteAddressModal()"></div>

    <!-- Dialog Card -->
    <div class="relative bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full border border-gray-100 shadow-2xl text-center space-y-4 transform scale-95 transition-all duration-200 z-10">
        <button type="button" onclick="closeDeleteAddressModal()" aria-label="Close Dialog"
            class="absolute top-4 right-4 w-8 h-8 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-400 hover:text-gray-700 flex items-center justify-center transition-colors cursor-pointer">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>

        <div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-600 border border-rose-100 flex items-center justify-center mx-auto text-xl shadow-xs">
            <i class="fa-solid fa-trash-can"></i>
        </div>

        <div class="space-y-1.5">
            <h3 class="font-heading font-extrabold text-lg text-gray-900 tracking-tight">
                Remove Address?
            </h3>
            <p id="deleteAddressLabel" class="text-xs text-gray-500 leading-relaxed">
                Are you sure you want to remove this delivery address?
            </p>
        </div>

        <div class="flex items-center gap-3 pt-2">
            <button type="button" onclick="closeDeleteAddressModal()"
                class="flex-1 py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition-colors cursor-pointer">
                Keep
            </button>
            <a id="deleteAddressConfirmBtn" href="#"
                class="flex-1 py-2.5 px-4 bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs rounded-xl shadow-md shadow-rose-600/25 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                <i class="fa-regular fa-trash-can text-xs"></i>
                <span>Remove</span>
            </a>
        </div>
    </div>
</div>

<script>
function openDeleteAddressModal(deleteUrl, addressSummary) {
    const modal = document.getElementById('deleteAddressModal');
    const confirmBtn = document.getElementById('deleteAddressConfirmBtn');
    const label = document.getElementById('deleteAddressLabel');
    if (modal && confirmBtn) {
        confirmBtn.href = deleteUrl;
        if (label && addressSummary) {
            label.textContent = `Are you sure you want to remove "${addressSummary}"?`;
        }
        modal.classList.remove('hidden');
        requestAnimationFrame(() => {
            modal.classList.remove('opacity-0');
            const card = modal.querySelector('.relative.bg-white');
            if (card) {
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }
        });
    }
}

function closeDeleteAddressModal() {
    const modal = document.getElementById('deleteAddressModal');
    if (modal) {
        modal.classList.add('opacity-0');
        const card = modal.querySelector('.relative.bg-white');
        if (card) {
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 200);
    }
}
</script>
