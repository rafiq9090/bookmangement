<!-- ================= CANCEL ORDER CONFIRMATION MODAL DIALOG ================= -->
<div id="cancelOrderModal" class="fixed inset-0 z-50 hidden opacity-0 transition-opacity duration-200 flex items-center justify-center p-4">
    <!-- Backdrop Blur -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-xs transition-opacity" onclick="closeCancelOrderModal()"></div>

    <!-- Dialog Card -->
    <div class="relative bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full border border-gray-100 shadow-2xl text-center space-y-5 transform scale-95 transition-all duration-200 z-10">
        
        <!-- Close 'X' Button -->
        <button type="button" onclick="closeCancelOrderModal()" aria-label="Close Dialog"
            class="absolute top-4 right-4 w-8 h-8 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-400 hover:text-gray-700 flex items-center justify-center transition-colors cursor-pointer">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>

        <!-- Warning Icon Circle -->
        <div class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-600 border border-rose-100 flex items-center justify-center mx-auto text-2xl shadow-xs">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <!-- Heading & Details -->
        <div class="space-y-2">
            <h3 class="font-heading font-extrabold text-xl text-gray-900 tracking-tight">
                Cancel Order <span id="cancelOrderModalId" class="text-rose-600 font-mono"></span>?
            </h3>
            <p class="text-xs sm:text-sm text-gray-500 leading-relaxed">
                Are you sure you want to cancel this order? Your funds will be released from escrow since the seller has not dispatched it yet.
            </p>
        </div>

        <!-- Informational Notice -->
        <div class="p-3 bg-amber-50 rounded-2xl border border-amber-200 text-[11px] text-amber-900 flex items-center gap-2.5 text-left">
            <i class="fa-solid fa-circle-info text-amber-600 text-sm flex-shrink-0"></i>
            <span>The reserved book copy will be returned to the store catalog for other readers.</span>
        </div>

        <!-- Form Actions -->
        <form id="cancelOrderModalForm" method="POST" action="">
            {% csrf_token %}
            <div class="flex flex-col-reverse sm:flex-row items-center gap-3 pt-2">
                <button type="button" onclick="closeCancelOrderModal()"
                    class="w-full sm:flex-1 py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition-colors cursor-pointer">
                    Keep Order
                </button>
                <button type="submit"
                    class="w-full sm:flex-1 py-3 px-4 bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs rounded-xl shadow-md shadow-rose-600/25 transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-ban text-xs"></i>
                    <span>Yes, Cancel Order</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function openCancelOrderModal(actionUrl, orderId) {
    const modal = document.getElementById('cancelOrderModal');
    const form = document.getElementById('cancelOrderModalForm');
    const idSpan = document.getElementById('cancelOrderModalId');
    if (modal && form && idSpan) {
        form.action = actionUrl;
        idSpan.textContent = orderId ? `#${orderId}` : '';
        modal.classList.remove('hidden');
        requestAnimationFrame(() => {
            modal.classList.remove('opacity-0');
            const card = modal.querySelector('.relative.bg-white');
            if (card) {
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }
        });
    }
}

function closeCancelOrderModal() {
    const modal = document.getElementById('cancelOrderModal');
    if (modal) {
        modal.classList.add('opacity-0');
        const card = modal.querySelector('.relative.bg-white');
        if (card) {
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 200);
    }
}

// Close on Escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeCancelOrderModal();
    }
});
</script>
