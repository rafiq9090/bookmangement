<!-- BEGIN: MainHeader -->
<header class="w-full max-w-[1360px] mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between box-border"
    data-purpose="site-header">
    <!-- Left Logo & Gift Banner -->
    <div class="flex items-center space-x-4">
        <a class="flex items-center space-x-1" href="{% url 'home' %}">
            <span
                class="bg-[#FF5A1F] text-white font-heading font-extrabold text-2xl w-10 h-10 rounded-xl flex items-center justify-center shadow-md shadow-orange-500/30">eB</span>
        </a>
        <div
            class="hidden sm:flex items-center space-x-2 bg-amber-50/80 border border-amber-100 rounded-full px-3.5 py-1 text-xs font-semibold text-gray-700">
            <i class="fa-solid fa-gift text-amber-500"></i>
            <span class="">Festival Gift Overs</span>
        </div>
    </div>
    <!-- Center Navigation Links -->
    <nav class="hidden md:flex items-center space-x-8 text-[15px] font-medium text-gray-600"
        data-purpose="primary-navigation">
        <a class="text-[#FF5A1F] font-semibold transition-colors" href="{% url 'home' %}">Home</a>
        <div class="relative group cursor-pointer flex items-center space-x-1 hover:text-gray-900 transition-colors py-2">
            <span>Categories</span>
            <i class="fa-solid fa-chevron-down text-xs text-gray-400 group-hover:translate-y-0.5 transition-transform"></i>
            <!-- Dropdown Menu -->
            <div class="absolute top-full left-0 hidden group-hover:block bg-white border border-gray-100 rounded-2xl shadow-xl py-3 px-4 min-w-[200px] z-50 space-y-2">
                <a href="{% url 'store' %}?category=fiction" class="block text-xs font-semibold text-gray-700 hover:text-[#FF5A1F] transition-colors">Fiction</a>
                <a href="{% url 'store' %}?category=non-fiction" class="block text-xs font-semibold text-gray-700 hover:text-[#FF5A1F] transition-colors">Non Fiction</a>
                <a href="{% url 'store' %}?category=history" class="block text-xs font-semibold text-gray-700 hover:text-[#FF5A1F] transition-colors">History</a>
                <a href="{% url 'store' %}?category=thriller" class="block text-xs font-semibold text-gray-700 hover:text-[#FF5A1F] transition-colors">Thriller</a>
                <a href="{% url 'store' %}?category=poetry" class="block text-xs font-semibold text-gray-700 hover:text-[#FF5A1F] transition-colors">Poetry</a>
                <div class="pt-2 border-t border-gray-100">
                    <a href="{% url 'store' %}" class="block text-[11px] font-bold text-[#FF5A1F] hover:underline">All Categories →</a>
                </div>
            </div>
        </div>
        <a class="hover:text-gray-900 transition-colors" href="{% url 'store' %}">Store</a>
        <a class="hover:text-gray-900 transition-colors" href="{% url 'store' %}?sort=featured">Featured</a>
        <a class="hover:text-gray-900 transition-colors" href="{% url 'cart' %}">Cart</a>
    </nav>
    <!-- Right Action Items -->
    <div class="flex items-center space-x-5">
        <a href="{% url 'store' %}" aria-label="Search" class="text-gray-600 hover:text-gray-900 transition-colors text-base" title="Search Books">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>
        <a href="{% url 'cart' %}" aria-label="Cart" class="text-gray-600 hover:text-gray-900 transition-colors text-base relative" title="View Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span
                class="absolute -top-1.5 -right-2 bg-[#FF5A1F] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                {{ cart_count|default:"0" }}
            </span>
        </a>
        <a class="flex items-center space-x-2 border border-gray-200 rounded-full px-4 py-1.5 text-sm font-semibold text-gray-700 hover:border-gray-400 hover:bg-gray-50 transition-all"
            href="{% url 'store' %}">
            <i class="fa-solid fa-store text-xs text-[#FF5A1F]"></i>
            <span>Shop Now</span>
        </a>
    </div>
</header>
<!-- END: MainHeader -->
