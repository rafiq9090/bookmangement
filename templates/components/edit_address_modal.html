<!-- ================= EDIT DELIVERY ADDRESS MODAL DIALOG ================= -->
<div id="editAddressModal" class="fixed inset-0 z-50 hidden opacity-0 transition-opacity duration-200 flex items-center justify-center p-4">
    <!-- Backdrop Blur -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-xs transition-opacity" onclick="closeEditAddressModal()"></div>

    <!-- Dialog Card -->
    <div class="relative bg-white rounded-3xl p-6 sm:p-8 max-w-lg w-full border border-gray-100 shadow-2xl space-y-5 transform scale-95 transition-all duration-200 z-10 max-h-[90vh] overflow-y-auto">
        
        <!-- Close 'X' Button -->
        <button type="button" onclick="closeEditAddressModal()" aria-label="Close Dialog"
            class="absolute top-5 right-5 w-8 h-8 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-400 hover:text-gray-700 flex items-center justify-center transition-colors cursor-pointer">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>

        <!-- Header -->
        <div class="flex items-center gap-3.5 border-b border-gray-100 pb-4">
            <div class="w-11 h-11 rounded-2xl bg-green-50 text-[#43A047] border border-green-100 flex items-center justify-center text-lg shadow-xs flex-shrink-0">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <div>
                <h3 class="font-heading font-extrabold text-lg text-gray-900 tracking-tight">
                    Edit Delivery Address
                </h3>
                <p class="text-xs text-gray-500">Update recipient details and courier drop-off destination.</p>
            </div>
        </div>

        <!-- Form -->
        <form method="POST" action="{% url 'profile' %}" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="form_type" value="edit_address">
            <input type="hidden" id="editAddressId" name="address_id" value="">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Recipient Name <span class="text-red-500">*</span></label>
                    <input type="text" id="editRecipientName" name="recipient_name" required placeholder="Full Name"
                        class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium text-gray-900 focus:bg-white focus:outline-none focus:border-[#43A047] transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Phone Number <span class="text-red-500">*</span></label>
                    <input type="text" id="editPhoneNumber" name="phone_number" required placeholder="+880 1712..."
                        class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium text-gray-900 focus:bg-white focus:outline-none focus:border-[#43A047] transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Street Address, House & Flat <span class="text-red-500">*</span></label>
                <input type="text" id="editStreetAddress" name="street_address" required placeholder="House 12, Road 4, Sector 7"
                    class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium text-gray-900 focus:bg-white focus:outline-none focus:border-[#43A047] transition-colors">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">City / District <span class="text-red-500">*</span></label>
                    <input type="text" id="editCity" name="city" required placeholder="Dhaka"
                        class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium text-gray-900 focus:bg-white focus:outline-none focus:border-[#43A047] transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">State / Division</label>
                    <input type="text" id="editStateDivision" name="state_division" placeholder="Dhaka Division"
                        class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium text-gray-900 focus:bg-white focus:outline-none focus:border-[#43A047] transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Postal Code</label>
                    <input type="text" id="editPostalCode" name="postal_code" placeholder="1230"
                        class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium text-gray-900 focus:bg-white focus:outline-none focus:border-[#43A047] transition-colors">
                </div>
            </div>

            <div class="pt-2">
                <label class="flex items-center space-x-2.5 cursor-pointer">
                    <input type="checkbox" id="editIsDefault" name="is_default"
                        class="w-4 h-4 rounded text-[#43A047] focus:ring-[#43A047]">
                    <span class="text-xs font-bold text-gray-700">Set as default shipping address</span>
                </label>
            </div>

            <div class="flex items-center justify-end gap-3 pt-3 border-t border-gray-100">
                <button type="button" onclick="closeEditAddressModal()"
                    class="py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition-colors cursor-pointer">
                    Cancel
                </button>
                <button type="submit"
                    class="py-2.5 px-5 bg-[#43A047] hover:bg-green-700 text-white font-extrabold text-xs rounded-xl shadow-md shadow-green-600/20 transition-all flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-check text-xs"></i>
                    <span>Save Changes</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function openEditAddressModal(id, recipient, phone, street, city, state, postal, isDefault) {
    const modal = document.getElementById('editAddressModal');
    if (!modal) return;

    document.getElementById('editAddressId').value = id || '';
    document.getElementById('editRecipientName').value = recipient || '';
    document.getElementById('editPhoneNumber').value = phone || '';
    document.getElementById('editStreetAddress').value = street || '';
    document.getElementById('editCity').value = city || '';
    document.getElementById('editStateDivision').value = state || '';
    document.getElementById('editPostalCode').value = postal || '';
    document.getElementById('editIsDefault').checked = isDefault === true || isDefault === 'true' || isDefault === 'True';

    modal.classList.remove('hidden');
    requestAnimationFrame(() => {
        modal.classList.remove('opacity-0');
        const card = modal.querySelector('.relative.bg-white');
        if (card) {
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }
    });
}

function closeEditAddressModal() {
    const modal = document.getElementById('editAddressModal');
    if (!modal) return;

    modal.classList.add('opacity-0');
    const card = modal.querySelector('.relative.bg-white');
    if (card) {
        card.classList.remove('scale-100');
        card.classList.add('scale-95');
    }
    setTimeout(() => {
        modal.classList.add('hidden');
    }, 200);
}

// Close on Escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeEditAddressModal();
    }
});
</script>
