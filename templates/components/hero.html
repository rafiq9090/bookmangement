                <!-- Carousel Pagination Dots & Labels -->

            <!-- Carousel Script -->
            <script>
                let currentHeroSlide = 0;
                const totalHeroSlides = 3;
                const heroSlideTitles = [
                    "Curated Contemporary Library",
                    "Rare & Vintage Classics Collection",
                    "Modern Fiction & Bestsellers"
                ];
                let heroAutoplayTimer = null;

                function updateHeroSlide() {
                    const track = document.getElementById('heroSlidesTrack');
                    const dots = document.querySelectorAll('.hero-dot');
                    const title = document.getElementById('heroSlideTitle');

                    if (track) {
                        track.style.transform = `translateX(-${currentHeroSlide * 100}%)`;
                    }

                    dots.forEach((dot, idx) => {
                        if (idx === currentHeroSlide) {
                            dot.className = 'hero-dot w-7 h-2 rounded-full bg-[#FF5A1F] transition-all cursor-pointer';
                        } else {
                            dot.className = 'hero-dot w-2.5 h-2 rounded-full bg-gray-300 hover:bg-gray-400 transition-all cursor-pointer';
                        }
                    });

                    if (title && heroSlideTitles[currentHeroSlide]) {
                        title.innerText = heroSlideTitles[currentHeroSlide];
                    }
                }

                function goToHeroSlide(index) {
                    currentHeroSlide = index;
                    updateHeroSlide();
                    resetHeroAutoplay();
                }

                function nextHeroSlide() {
                    currentHeroSlide = (currentHeroSlide + 1) % totalHeroSlides;
                    updateHeroSlide();
                    resetHeroAutoplay();
                }

                function prevHeroSlide() {
                    currentHeroSlide = (currentHeroSlide - 1 + totalHeroSlides) % totalHeroSlides;
                    updateHeroSlide();
                    resetHeroAutoplay();
                }

                function startHeroAutoplay() {
                    heroAutoplayTimer = setInterval(() => {
                        currentHeroSlide = (currentHeroSlide + 1) % totalHeroSlides;
                        updateHeroSlide();
                    }, 4500);
                }

                function resetHeroAutoplay() {
                    if (heroAutoplayTimer) {
                        clearInterval(heroAutoplayTimer);
                    }
                    startHeroAutoplay();
                }

                document.addEventListener('DOMContentLoaded', () => {
                    startHeroAutoplay();

                    const container = document.getElementById('heroSliderContainer');
                    if (container) {
                        container.addEventListener('mouseenter', () => {
                            if (heroAutoplayTimer) clearInterval(heroAutoplayTimer);
                        });
                        container.addEventListener('mouseleave', () => {
                            startHeroAutoplay();
                        });
                    }
                });
            </script>
