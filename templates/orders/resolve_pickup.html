{% extends "base.html" %}{% block content %}<section class="max-w-xl mx-auto p-6"><h1>Resolve disputed pickup: {{ agreement.listing.book.title }}</h1><p>{{ agreement.problem_details }}</p>{% for message in messages %}<p>{{ message }}</p>{% endfor %}<form method="post">{% csrf_token %}<select name="outcome"><option value="completed">Book handed over: complete sale</option><option value="cancelled">Book remains with seller: cancel and restock</option></select><textarea name="note" required placeholder="Record investigation and reason"></textarea><button>Resolve and notify participants</button></form></section>{% endblock %}
