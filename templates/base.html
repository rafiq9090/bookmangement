{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{% block title %}eB - Online Bookshop{% endblock %}</title>

    <!-- Tailwind CSS v3 CDN with forms & container queries plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Poppins & Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800;900&amp;display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            orange: '#FF5A1F',
                            green: '#43A047',
                            darkGreen: '#2E7D32',
                            dark: '#111827',
                            bgLight: '#FFFDF9',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles for Ambient Glow and Details -->
    <style data-purpose="ambient-backgrounds">
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .glow-bg {
            background: radial-gradient(circle at 10% 15%, rgba(255, 237, 213, 0.45) 0%, transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(243, 232, 255, 0.5) 0%, transparent 45%),
                radial-gradient(circle at 90% 60%, rgba(254, 240, 138, 0.35) 0%, transparent 40%),
                radial-gradient(circle at 5% 75%, rgba(255, 228, 230, 0.4) 0%, transparent 45%);
        }

        .shelf-shadow {
            filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.15));
        }
    </style>

    <!-- Custom Micro-interactions & Styles -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">

    {% block extra_head %}{% endblock %}
</head>

<body
    class="bg-[#FFFDF9] text-gray-800 font-sans antialiased overflow-x-hidden glow-bg selection:bg-brand-orange selection:text-white">

    <!-- Global Header -->
    {% include "components/header.html" %}

    <!-- Main Content Area -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    {% include "components/footer.html" %}

    <!-- Global Scripts -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
